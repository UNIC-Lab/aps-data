# Adv-MLP Baseline 配置
# Adversarially regularized MLP for APS prediction

data:
  preprocessed_dir: "/home/DataDisk/jxhuang/aps_preprocessed"
  num_workers: 8
  pin_memory: true

model:
  seq_len: 180
  z_dim: 128              # Generator noise dimension

training:
  epochs: 20
  batch_size: 1024
  lr_g: 0.0002            # Generator learning rate
  lr_d: 0.0002            # Discriminator learning rate
  beta1: 0.5              # Adam beta1 for adversarial training
  beta2: 0.999
  weight_decay: 0.0
  grad_clip: 1.0
  lambda_l1: 100.0        # L1 reconstruction loss weight
  n_critic: 1             # D 每训练 n_critic 次，G 训练 1 次
  mixed_precision: "bf16"
  distributed: false

device: "cuda"
seed: 42

logging:
  use_wandb: false
  wandb_project: 'adv-mlp-aps'
  exp_name: 'adv_mlp'
  checkpoint_dir: '/home/DataDisk/jxhuang/checkpoints/adv_mlp'
  log_dir: 'baselines/adv_mlp/logs'
