# MS-AReg: Multi-Scale Adversarial Regression (Proposed Method)
# Based on Adv-MLP with Multi-Scale Encoder

data:
  preprocessed_dir: "/home/DataDisk/jxhuang/aps_preprocessed"
  num_workers: 8
  pin_memory: true

model:
  seq_len: 180
  z_dim: 128
  proj_dim: 256              # Multi-Scale Encoder projection dim
  use_pretrained: true

training:
  epochs: 20
  batch_size: 1024
  lr_g: 0.0002
  lr_d: 0.0002
  beta1: 0.5
  beta2: 0.999
  weight_decay: 0.0
  grad_clip: 1.0
  lambda_l1: 100.0
  n_critic: 1
  mixed_precision: "bf16"
  distributed: false

device: "cuda"
seed: 42

logging:
  use_wandb: false
  wandb_project: 'ms-areg-aps'
  exp_name: 'ms_areg'
  checkpoint_dir: '/home/DataDisk/jxhuang/checkpoints/ms_areg'
  log_dir: 'baselines/ms_areg/logs'
