# ViT Regression Baseline 配置
# ViT-B/16 直接回归 APS

data:
  preprocessed_dir: "/home/DataDisk/jxhuang/aps_preprocessed"
  num_workers: 8
  pin_memory: true

model:
  seq_len: 180
  use_pretrained: true    # ImageNet 预训练 ViT-B/16
  hidden_dim: 512         # Regression head hidden dim
  dropout: 0.1

training:
  epochs: 20
  batch_size: 512         # ViT-B/16 较大，batch 适当小
  learning_rate: 0.0001
  warmup_steps: 500
  weight_decay: 0.01
  grad_clip: 1.0
  mixed_precision: "bf16"
  distributed: false

device: "cuda"
seed: 42

logging:
  use_wandb: false
  wandb_project: 'vit-reg-aps'
  exp_name: 'vit_reg'
  checkpoint_dir: '/home/DataDisk/jxhuang/checkpoints/vit_reg'
  log_dir: 'baselines/vit_reg/logs'
