# RadioUNet Baseline 配置
# UNet 直接回归 APS

data:
  preprocessed_dir: "/home/DataDisk/jxhuang/aps_preprocessed"
  num_workers: 8
  pin_memory: true

model:
  seq_len: 180

training:
  epochs: 20
  batch_size: 256
  learning_rate: 0.0003
  warmup_steps: 500
  weight_decay: 0.01
  grad_clip: 1.0
  mixed_precision: "bf16"
  distributed: false

device: "cuda"
seed: 42

logging:
  use_wandb: false
  wandb_project: 'radiounet-aps'
  exp_name: 'radiounet'
  checkpoint_dir: '/home/DataDisk/jxhuang/checkpoints/radiounet'
  log_dir: 'baselines/radiounet/logs'
