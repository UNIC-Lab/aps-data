# MS-MLP 配置
# Ablation: Multi-Scale Encoder + MLP Decoder, pure regression (no adversarial)

data:
  preprocessed_dir: "/home/DataDisk/jxhuang/aps_preprocessed"
  num_workers: 8
  pin_memory: true

model:
  seq_len: 180
  proj_dim: 256
  use_pretrained: true

training:
  epochs: 20
  batch_size: 512
  learning_rate: 0.0003
  warmup_steps: 500
  weight_decay: 0.01
  grad_clip: 1.0
  mixed_precision: "bf16"
  distributed: false

device: "cuda"
seed: 42

logging:
  use_wandb: false
  wandb_project: 'ms-mlp-aps'
  exp_name: 'ms_mlp'
  checkpoint_dir: '/home/DataDisk/jxhuang/checkpoints/ms_mlp'
  log_dir: 'baselines/ms_mlp/logs'
